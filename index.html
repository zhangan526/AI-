<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5ff" />
  <title>灵伴 · AI 手机桌宠</title>
  <style>
    :root { --ink:#28253b; --muted:#8d8aa1; --purple:#7467f5; --purple2:#a394ff; --card:rgba(255,255,255,.78); --line:rgba(68,56,130,.1); --shadow:0 18px 50px rgba(83,70,163,.12); }
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#fbfaff 0%,#f2f0ff 55%,#eaf7ff 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;min-height:100vh}
    .app{width:min(100%,430px);margin:0 auto;padding:18px 18px 100px;position:relative;overflow:hidden}.glow{position:absolute;width:240px;height:240px;background:#dcd7ff;filter:blur(65px);opacity:.55;right:-110px;top:70px;pointer-events:none}
    .topbar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:.3px}.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,#887bff,#6253e9);display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px #786bf047;font-size:22px}.icon-btn{border:1px solid var(--line);background:#ffffff92;width:40px;height:40px;border-radius:14px;color:var(--ink);font-size:19px}
    .hero{margin-top:22px;background:var(--card);border:1px solid #fff;border-radius:28px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#eeeaff;right:-55px;top:-60px}.status{color:var(--muted);font-size:13px;margin:0 0 4px;position:relative;z-index:1}.hero h1{font-size:27px;margin:0 0 16px;position:relative;z-index:1}.pet-wrap{height:180px;display:grid;place-items:center;position:relative;z-index:1}.pet{width:132px;height:132px;border-radius:48% 52% 45% 55%;background:linear-gradient(150deg,#b7adff,#7565ef);box-shadow:inset -14px -18px 0 #6556df55,0 22px 30px #6356cc3d;position:relative;animation:float 3.4s ease-in-out infinite}.pet:before,.pet:after{content:"";position:absolute;width:38px;height:54px;top:-24px;background:#8375f5;border-radius:70% 30% 55% 35%;z-index:-1}.pet:before{left:11px;transform:rotate(-22deg)}.pet:after{right:11px;transform:scaleX(-1) rotate(-22deg)}.eye{position:absolute;top:51px;width:12px;height:16px;background:#302a5f;border-radius:50%}.eye.l{left:39px}.eye.r{right:39px}.blush{position:absolute;top:73px;width:22px;height:10px;border-radius:50%;background:#e9a6cb88}.blush.l{left:23px}.blush.r{right:23px}.mouth{position:absolute;left:56px;top:73px;width:20px;height:12px;border-bottom:3px solid #3d337c;border-radius:50%}.spark{position:absolute;color:#a79fff;font-size:20px;animation:twinkle 2s infinite}.s1{left:22%;top:22%}.s2{right:17%;top:44%;font-size:14px;animation-delay:.7s}.s3{left:16%;bottom:18%;font-size:13px;animation-delay:1s}@keyframes float{50%{transform:translateY(-9px) rotate(2deg)}}@keyframes twinkle{50%{opacity:.35;transform:scale(.75)}}
    .bubble{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 14px;font-size:14px;line-height:1.5;position:relative;z-index:2;box-shadow:0 8px 20px #6c60b312}.bubble b{color:var(--purple)}
    .section{margin-top:22px;display:flex;align-items:center;justify-content:space-between}.section h2{font-size:17px;margin:0}.link{font-size:13px;color:var(--purple);font-weight:700}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:11px}.card{background:var(--card);border:1px solid #fff;border-radius:20px;padding:15px;box-shadow:0 10px 25px #6c60b30c}.card .emoji{font-size:24px}.card p{font-size:13px;line-height:1.45;margin:8px 0 0}.card small{color:var(--muted);font-size:11px}.quick{display:flex;gap:10px;overflow:auto;margin-top:12px;padding-bottom:3px}.quick button{white-space:nowrap;border:1px solid #fff;background:#ffffffa8;color:var(--ink);padding:10px 13px;border-radius:14px;font-size:13px}.quick button:active{transform:scale(.97)}
    .chat{margin-top:14px;background:#ffffffb8;border:1px solid #fff;border-radius:22px;padding:13px;display:flex;gap:9px;align-items:center}.chat input{border:0;outline:0;background:transparent;flex:1;font-size:14px;color:var(--ink)}.send{border:0;background:var(--purple);color:#fff;border-radius:12px;width:36px;height:36px;font-size:16px}.toast{font-size:12px;color:var(--purple);height:16px;margin:7px 3px 0;opacity:0;transition:.25s}.toast.show{opacity:1}
    .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);padding:11px 22px calc(11px + env(safe-area-inset-bottom));background:#ffffffd9;backdrop-filter:blur(18px);border-top:1px solid #fff;display:flex;justify-content:space-around;z-index:5}.nav button{border:0;background:none;color:var(--muted);font-size:11px;display:grid;gap:4px;place-items:center}.nav button span{font-size:20px}.nav button.active{color:var(--purple);font-weight:700}
  </style>
</head>
<body>
  <main class="app"><div class="glow"></div>
    <header class="topbar"><div class="brand"><div class="logo">✦</div>灵伴</div><button class="icon-btn" aria-label="设置">⚙</button></header>
    <section class="hero">
      <p class="status">周三 · 09:41　<span style="color:#53b889">● 在线</span></p><h1>早上好，林夏</h1>
      <div class="pet-wrap"><i class="spark s1">✦</i><i class="spark s2">✧</i><i class="spark s3">✦</i><div class="pet"><i class="eye l"></i><i class="eye r"></i><i class="blush l"></i><i class="blush r"></i><i class="mouth"></i></div></div>
      <div class="bubble"><b>灵灵：</b>我记得你今天 10:30 有产品评审。要不要我帮你把昨天的讨论整理成一页重点？</div>
    </section>
    <div class="section"><h2>今天为你准备</h2><span class="link">查看全部 ›</span></div>
    <div class="cards"><article class="card"><span class="emoji">☀️</span><p><b>出门提醒</b><br>多云，18–24°C<br><small>建议带一把伞</small></p></article><article class="card"><span class="emoji">📝</span><p><b>3 个待办</b><br>评审 · 回邮件 · 买咖啡<br><small>最晚今天完成</small></p></article></div>
    <div class="section"><h2>你可以这样说</h2></div><div class="quick"><button data-msg="帮我安排今天的计划">安排今日计划</button><button data-msg="我最近有哪些重要事情？">回顾重要事项</button><button data-msg="记住我喜欢少糖拿铁">记住这件事</button></div>
    <div class="chat"><span style="font-size:20px">🎙️</span><input id="input" placeholder="和灵灵说点什么…"/><button class="send" id="send">↑</button></div><div class="toast" id="toast"></div>
    <nav class="nav"><button class="active"><span>⌂</span>首页</button><button><span>◌</span>对话</button><button><span>♡</span>记忆</button><button><span>☷</span>我的</button></nav>
  </main>
  <script>
    const input=document.querySelector('#input'), send=document.querySelector('#send'), toast=document.querySelector('#toast');
    function talk(msg){if(!msg.trim())return; input.value=''; toast.textContent='灵灵正在思考…'; toast.classList.add('show'); setTimeout(()=>{toast.textContent='收到啦，我会记在心里。';},700); setTimeout(()=>toast.classList.remove('show'),2600)}
    send.onclick=()=>talk(input.value); input.addEventListener('keydown',e=>{if(e.key==='Enter')talk(input.value)}); document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{input.value=b.dataset.msg; talk(input.value)});
  </script>
</body>
</html>
